name: xiuxian4-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          for file in .test/*_test.py; do
            python "$file"
          done
      - name: Ruff
        run: ruff check game launch message main.py .test
      - name: Vulture
        run: vulture game launch message main.py .ops --min-confidence 80
      - name: Architecture gates
        shell: bash
        run: |
          set -euo pipefail
          python .test/core_governance_test.py
          python .test/content_extension_contract_test.py
          python .test/world_extension_contract_test.py
      - name: Check patch whitespace
        run: git diff --check
